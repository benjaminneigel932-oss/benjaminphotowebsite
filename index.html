<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin Neigel Photography</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-offwhite: #121212;
            --text-black: #FAF9F6;
            --accent-orange: #FAF9F6;
            --font-header: 'Unbounded', sans-serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            min-height: 100vh;
            background-color: hsla(0,0%,0%,1);
            background-image:
                radial-gradient(at 40% 20%, hsla(25,100%,50%,1) 0px, transparent 50%),
                radial-gradient(at 83% 14%, hsla(36,100%,50%,1) 0px, transparent 50%),
                radial-gradient(at 100% 89%, hsla(355,0%,0%,1) 0px, transparent 50%),
                radial-gradient(at 65% 56%, hsla(0,100%,50%,1) 0px, transparent 50%),
                radial-gradient(at 18% 80%, hsla(19,100%,36%,1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-black);
            font-family: var(--font-body);
            line-height: 1.6;
        }

        /* Typography */
        h1, h2, h3 {
            font-family: var(--font-header);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 900;
            word-break: break-word;
        }

        /* Navigation */
        header {
            position: sticky;
            top: 0;
            background-color: #121212;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            border-bottom: 2px solid var(--text-black);
            z-index: 1000;
            width: 100%;
        }

        /* Punched-out logo effect */
        .brand-logo {
            font-family: var(--font-header);
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #121212;
            background-color: #FAF9F6;
            mix-blend-mode: screen;
            padding: 0.2rem 0.5rem;
            text-decoration: none;
            display: inline-block;
            line-height: 1;
        }

        nav a {
            color: var(--text-black);
            text-decoration: none;
            margin-left: 1rem;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent-orange);
        }

        /* Hero Section */
        .hero {
            padding: 4rem 5% 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 6vw, 4.5rem);
            line-height: 1.1;
        }

        .promo-bar {
            display: inline-block;
            background-color: var(--accent-orange);
            color: #121212;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.6rem 1.2rem;
            margin-top: 1.5rem;
            max-width: 100%;
        }

        /* Work / Masonry Gallery */
        #work {
            padding: 2rem 5% 4rem;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            border-left: 6px solid var(--accent-orange);
            padding-left: 1rem;
        }

        .masonry-grid {
            column-count: 3;
            column-gap: 1.2rem;
        }

        @media (max-width: 900px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .masonry-grid {
                column-count: 1;
            }
            
            header {
                padding: 1rem 4%;
            }
            
            .brand-logo {
                font-size: 1.3rem;
            }
            
            nav a {
                margin-left: 0.75rem;
                font-size: 0.85rem;
            }
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 1.2rem;
            border: none;
            overflow: hidden;
            background-color: #1e1e1e;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        /* Contact Section */
        #contact {
            background-color: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-black);
            padding: 4rem 5%;
            border-top: 1px solid #222;
        }

        #contact .section-title {
            border-left-color: var(--accent-orange);
            color: var(--text-black);
        }

        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
            align-items: start;
        }

        .contact-info p {
            margin-bottom: 1.5rem;
            font-size: 1rem;
            font-weight: 300;
        }

        .email-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--accent-orange);
            color: #121212;
            font-family: var(--font-header);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            border: 2px solid var(--accent-orange);
            cursor: pointer;
            transition: opacity 0.2s ease;
            text-decoration: none;
            max-width: 100%;
        }

        .email-btn:hover {
            opacity: 0.9;
        }

        /* Social Links Styling */
        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1.4rem;
            border: 2px solid var(--accent-orange);
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .social-btn:hover {
            background-color: var(--accent-orange);
            color: #121212;
        }

        footer {
            padding: 2rem 5%;
            background-color: #0a0a0a;
            border-top: 1px solid #222;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="#" class="brand-logo">BNP</a>
        <nav>
            <a href="#work">Work</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Hero Header -->
    <section class="hero">
        <h1>Benjamin Neigel Photography</h1>
        <div class="promo-bar">

    </section>

    <section id="work">

        <div class="masonry-grid">
            <div class="gallery-item"><img src="images/purplecar2.jpg" alt="Purple Car"></div>

            <div class="gallery-item"><img src="images/rockychair-2.jpg" alt="Rocky Chair 2"></div>
            <div class="gallery-item"><img src="images/squirrelclose.jpg" alt="Squirrel Close Up"></div>
            <div class="gallery-item"><img src="images/squirreltree1.jpg" alt="Squirrel in Tree"></div>
            <div class="gallery-item"><img src="images/squirrleb&w1.jpg" alt="Squirrel Black and White"></div>
            <div class="gallery-item"><img src="images/starsbetter.jpg" alt="Stars"></div>
            <div class="gallery-item"><img src="images/starsbetter1.jpg" alt="Night Sky Stars"></div>
            <div class="gallery-item"><img src="images/succulent.jpg" alt="Succulent Plant"></div>
            <div class="gallery-item"><img src="images/whitecarblueinterior2.jpg" alt="White Car Interior"></div>
        </div>
    </section>

    <!-- Contact & Socials -->
    <section id="contact">
        <h2 class="section-title">Get In Touch</h2>
        <div class="contact-container">
            <div class="contact-info">
                <p>Available for project inquiries and creative collaboration.</p>

                <p><strong>Follow along:</strong></p>
                <div class="social-links">
                    <!-- Instagram Link -->
                    <a href="https://www.instagram.com/benjaminnei095" target="_blank" class="social-btn">

                    <a href="https://www.tiktok.com/@benjaminnei095" target="_blank" class="social-btn">

                        TikTok

                </div>
            </div>

            <!-- One-Click Copy Email Button -->
            <div>
                <button onclick="copyEmail()" class="email-btn" id="copyBtn">
                    Copy Email Address
                </button>
            </div>
        </div>
    </section>

    <footer>
        &copy; Benjamin Neigel Photography. All rights reserved.
    </footer>

    <script>
        function copyEmail() {
            const email = "benjaminneigel095@gmail.com"; 
            navigator.clipboard.writeText(email);
            
            const btn = document.getElementById("copyBtn");
            btn.innerText = "Copied to Clipboard!";
            setTimeout(() => {
                btn.innerText = "Copy Email Address";
            }, 2500);
        }
    </script>

</body>
</html>
